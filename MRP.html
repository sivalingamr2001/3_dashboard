<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRP Hierarchy Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #eff2f5;
            --bg-hover: #eaeef2;
            --bg-active: #0969da15;
            --border-color: #d0d7de;
            --border-light: #eff1f3;
            --text-primary: #1f2328;
            --text-secondary: #57606a;
            --text-muted: #65727e;
            --accent-blue: #0969da;
            --accent-green: #1a7f37;
            --accent-orange: #bc4c00;
            --accent-red: #cf222e;
            --accent-purple: #8250df;
            --accent-yellow: #9a6700;
            --success: #2da44e;
            --warning: #bf8700;
            --danger: #cf222e;
            --info: #0969da;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ===== LEFT SIDEBAR ===== */
        .sidebar {
            width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .sidebar-header h1 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sidebar-header .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .search-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .tree-container::-webkit-scrollbar {
            width: 6px;
        }

        .tree-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .tree-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Tree Node Styles */
        .tree-node {
            user-select: none;
        }

        .node-content {
            display: flex;
            align-items: center;
            padding: 6px 16px 6px 12px;
            cursor: pointer;
            border-radius: 0;
            transition: background 0.15s;
            position: relative;
        }

        .node-content:hover {
            background: var(--bg-hover);
        }

        .node-content.active {
            background: var(--bg-active);
            border-left: 3px solid var(--accent-blue);
            padding-left: 9px;
        }

        .toggle-btn {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
            color: var(--text-muted);
            font-size: 10px;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .toggle-btn.expanded {
            transform: rotate(90deg);
        }

        .toggle-btn.leaf {
            visibility: hidden;
        }

        .node-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .icon-parent {
            background: var(--accent-blue);
            color: #fff;
        }

        .icon-assembly {
            background: var(--accent-purple);
            color: #fff;
        }

        .icon-component {
            background: var(--accent-green);
            color: #fff;
        }

        .icon-shortage {
            background: var(--accent-red);
            color: #fff;
        }

        .icon-stock {
            background: var(--accent-green);
            color: #fff;
        }

        .icon-product {
            background: var(--accent-orange);
            color: #fff;
        }

        .node-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
            padding-left: 8px;
        }

        .children {
            display: none;
        }

        .children.expanded {
            display: block;
        }

        .level-1 .node-content {
            padding-left: 12px;
        }

        .level-2 .node-content {
            padding-left: 32px;
        }

        .level-3 .node-content {
            padding-left: 52px;
        }

        .level-3 .node-content.active {
            padding-left: 49px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .top-bar {
            height: 56px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .breadcrumb-item {
            color: var(--text-secondary);
        }

        .breadcrumb-item.active {
            color: var(--text-primary);
            font-weight: 600;
        }

        .breadcrumb-separator {
            color: var(--text-muted);
            font-size: 11px;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            background: #79b8ff;
            border-color: #79b8ff;
        }

        /* ===== DETAILS PANEL ===== */
        .details-panel {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .details-panel::-webkit-scrollbar {
            width: 8px;
        }

        .details-panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .details-panel::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .details-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
        }

        .details-empty svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .details-empty h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .details-empty p {
            font-size: 13px;
        }

        /* Card Styles */
        .detail-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .detail-card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .detail-card-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-card-header .badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-success {
            background: rgba(35, 134, 54, 0.2);
            color: var(--accent-green);
            border: 1px solid rgba(35, 134, 54, 0.3);
        }

        .badge-warning {
            background: rgba(158, 106, 3, 0.2);
            color: var(--accent-yellow);
            border: 1px solid rgba(158, 106, 3, 0.3);
        }

        .badge-danger {
            background: rgba(218, 54, 51, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(218, 54, 51, 0.3);
        }

        .badge-info {
            background: rgba(31, 111, 235, 0.2);
            color: var(--accent-blue);
            border: 1px solid rgba(31, 111, 235, 0.3);
        }

        .detail-card-body {
            padding: 20px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            transition: border-color 0.2s;
        }

        .stat-box:hover {
            border-color: var(--border-light);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-value.success {
            color: var(--accent-green);
        }

        .stat-value.warning {
            color: var(--accent-yellow);
        }

        .stat-value.danger {
            color: var(--accent-red);
        }

        .stat-value.info {
            color: var(--accent-blue);
        }

        .stat-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
        }

        .info-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
        }

        .info-item:nth-child(3n) {
            border-right: none;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
        }

        .info-value.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 8px;
        }

        .progress-bar-bg {
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-bar-fill.success {
            background: var(--accent-green);
        }

        .progress-bar-fill.warning {
            background: var(--accent-yellow);
        }

        .progress-bar-fill.danger {
            background: var(--accent-red);
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th {
            text-align: left;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            color: var(--text-muted);
            font-weight: 500;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .data-table tr:hover td {
            background: var(--bg-hover);
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }

        /* Status Dot */
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-dot.green {
            background: var(--accent-green);
            box-shadow: 0 0 6px rgba(63, 185, 80, 0.4);
        }

        .status-dot.yellow {
            background: var(--accent-yellow);
            box-shadow: 0 0 6px rgba(210, 153, 34, 0.4);
        }

        .status-dot.red {
            background: var(--accent-red);
            box-shadow: 0 0 6px rgba(248, 81, 73, 0.4);
        }

        .status-dot.blue {
            background: var(--accent-blue);
            box-shadow: 0 0 6px rgba(88, 166, 255, 0.4);
        }

        /* Section Title */
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 24px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .info-item:nth-child(3n) {
                border-right: 1px solid var(--border-light);
            }

            .info-item:nth-child(2n) {
                border-right: none;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 260px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .info-item {
                border-right: none;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .delay-1 {
            animation-delay: 0.05s;
            opacity: 0;
        }

        .delay-2 {
            animation-delay: 0.1s;
            opacity: 0;
        }

        .delay-3 {
            animation-delay: 0.15s;
            opacity: 0;
        }

        .delay-4 {
            animation-delay: 0.2s;
            opacity: 0;
        }

        /* Tag */
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            gap: 4px;
        }

        .tag-po {
            background: rgba(163, 113, 247, 0.15);
            color: var(--accent-purple);
        }

        .tag-onhand {
            background: rgba(35, 134, 54, 0.15);
            color: var(--accent-green);
        }

        .tag-release {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

            <div class="details-panel" id="detailsPanel">

                    </svg>
                    <h3>Select a Component</h3>
                    <p>Click on any component in the hierarchy tree to view detailed MRP information.</p>
                </div>
            </div>
        </main>
    </div>

        let selectedComponent = null;
        let expandedNodes = new Set();

        // ===== RENDER TREE =====
        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            Object.entries(mrpData).forEach(([parentKey, parentData]) => {
                const parentNode = document.createElement('div');
                parentNode.className = 'tree-node';
                parentNode.dataset.search = `${parentData.mps_id} ${parentData.input_item}`.toLowerCase();

                const isExpanded = expandedNodes.has(parentKey);

                const parentContent = document.createElement('div');
                parentContent.className = `node-content level-1 ${isExpanded ? 'expanded-parent' : ''}`;
                parentContent.innerHTML = `
      <span class="toggle-btn ${isExpanded ? 'expanded' : ''}" onclick="toggleNode(event, '${parentKey}')">▶</span>
      <span class="node-icon icon-parent">TX</span>
      <span class="node-label">${parentData.mps_id}</span>
      <span class="node-meta">${parentData.input_item}</span>
    `;
                parentNode.appendChild(parentContent);

                const childrenContainer = document.createElement('div');
                childrenContainer.className = `children ${isExpanded ? 'expanded' : ''}`;
                childrenContainer.dataset.parent = parentKey;

                Object.entries(parentData.children).forEach(([assemblyKey, assemblyData]) => {
                    const assemblyNode = document.createElement('div');
                    assemblyNode.className = 'tree-node';
                    assemblyNode.dataset.search = `${assemblyKey}`.toLowerCase();

                    const assemblyContent = document.createElement('div');
                    assemblyContent.className = 'node-content level-2';
                    assemblyContent.innerHTML = `
        <span class="toggle-btn leaf">▶</span>
        <span class="node-icon icon-assembly">AS</span>
        <span class="node-label">${assemblyKey}</span>
        <span class="node-meta">${assemblyData.components.length} items</span>
      `;
                    assemblyNode.appendChild(assemblyContent);

                    const compContainer = document.createElement('div');
                    compContainer.className = 'children expanded';

                    assemblyData.components.forEach((comp, idx) => {
                        const compNode = document.createElement('div');
                        compNode.className = 'tree-node';
                        compNode.dataset.search = `${comp.component_no} ${comp.required_type}`.toLowerCase();

                        const iconClass = comp.required_type === 'Component Shortage' ? 'icon-shortage' :
                            comp.required_type === 'Component Stock' ? 'icon-stock' : 'icon-product';
                        const iconText = comp.required_type === 'Component Shortage' ? 'SH' :
                            comp.required_type === 'Component Stock' ? 'ST' : 'PR';

                        const compContent = document.createElement('div');
                        compContent.className = 'node-content level-3';
                        compContent.dataset.component = JSON.stringify(comp);
                        compContent.dataset.parentKey = parentKey;
                        compContent.dataset.assembly = assemblyKey;
                        compContent.onclick = () => selectComponent(compContent, comp, parentData, assemblyKey);

                        compContent.innerHTML = `
          <span class="toggle-btn leaf">▶</span>
          <span class="node-icon ${iconClass}">${iconText}</span>
          <span class="node-label">${comp.component_no}</span>
          <span class="node-meta">${comp.allocated_qty}</span>
        `;
                        compNode.appendChild(compContent);
                        compContainer.appendChild(compNode);
                    });

                    assemblyNode.appendChild(compContainer);
                    childrenContainer.appendChild(assemblyNode);
                });

                parentNode.appendChild(childrenContainer);
                container.appendChild(parentNode);
            });
        }

        function toggleNode(event, key) {
            event.stopPropagation();
            const btn = event.target;
            const children = btn.closest('.tree-node').querySelector('.children');

            if (expandedNodes.has(key)) {
                expandedNodes.delete(key);
                btn.classList.remove('expanded');
                children.classList.remove('expanded');
            } else {
                expandedNodes.add(key);
                btn.classList.add('expanded');
                children.classList.add('expanded');
            }
        }

        function filterTree() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const nodes = document.querySelectorAll('.tree-node');

            nodes.forEach(node => {
                const searchText = node.dataset.search || '';
                if (query === '' || searchText.includes(query)) {
                    node.style.display = '';
                } else {
                    node.style.display = 'none';
                }
            });
        }

        // ===== SELECT COMPONENT =====
        function selectComponent(el, comp, parentData, assemblyKey) {
            document.querySelectorAll('.node-content.active').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
            selectedComponent = comp;

            document.getElementById('breadcrumb').innerHTML = `
    <span class="breadcrumb-item">MRP Dashboard</span>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-item">${parentData.mps_id}</span>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-item">${assemblyKey}</span>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-item active">${comp.component_no}</span>
  `;

            renderDetails(comp, parentData, assemblyKey);
        }

        // ===== RENDER DETAILS =====
        function renderDetails(comp, parentData, assemblyKey) {
            const panel = document.getElementById('detailsPanel');

            const shortageRatio = comp.demand_qty > 0 ? (comp.allocated_qty / comp.demand_qty * 100) : 0;
            const isShortage = comp.required_type === 'Component Shortage';
            const isStock = comp.required_type === 'Component Stock';

            const badgeClass = isShortage ? 'badge-danger' : isStock ? 'badge-success' : 'badge-info';
            const statusColor = isShortage ? 'danger' : isStock ? 'success' : 'info';
            const statusDot = isShortage ? 'red' : isStock ? 'green' : 'blue';

            const supplyStatus = comp.supply_qty >= comp.demand_qty ? 'Adequate' : 'Insufficient';
            const supplyStatusColor = comp.supply_qty >= comp.demand_qty ? 'success' : 'warning';
            const coverageRatio = comp.demand_qty > 0 ? Math.min((comp.supply_qty / comp.demand_qty * 100), 999).toFixed(1) : 0;

            panel.innerHTML = `
    <div class="animate-in">
      <div class="detail-card">
        <div class="detail-card-header">
          <h3><span class="status-dot ${statusDot}"></span>Component ${comp.component_no}</h3>
          <span class="badge ${badgeClass}">${comp.required_type}</span>
        </div>
        <div class="detail-card-body">
          <div class="stats-grid">
            <div class="stat-box">
              <div class="stat-label">Demand Quantity</div>
              <div class="stat-value">${comp.demand_qty.toLocaleString()}</div>
              <div class="stat-sub">Required by ${comp.demand_date}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Supply Quantity</div>
              <div class="stat-value ${supplyStatusColor}">${comp.supply_qty.toLocaleString()}</div>
              <div class="stat-sub">${supplyStatus} coverage</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Allocated Qty</div>
              <div class="stat-value ${statusColor}">${comp.allocated_qty.toLocaleString()}</div>
              <div class="stat-sub">${shortageRatio.toFixed(1)}% of demand</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Coverage Ratio</div>
              <div class="stat-value ${supplyStatusColor}">${coverageRatio}%</div>
              <div class="progress-container">
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill ${supplyStatusColor}" style="width: ${Math.min(coverageRatio, 100)}%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="detail-card animate-in delay-1">
        <div class="detail-card-header">
          <h3>📦 Supply Information</h3>
          <span class="tag ${comp.supply_category === 'Purchase order' ? 'tag-po' : comp.supply_category === 'On Hand' ? 'tag-onhand' : 'tag-release'}">${comp.supply_category || 'N/A'}</span>
        </div>
        <div class="detail-card-body">
          <div class="info-grid">
            <div class="info-item"><div class="info-label">Supply Type</div><div class="info-value">${comp.supply_type}</div></div>
            <div class="info-item"><div class="info-label">Supply Category</div><div class="info-value">${comp.supply_category || '<span class="empty">—</span>'}</div></div>
            <div class="info-item"><div class="info-label">Supply Date</div><div class="info-value">${comp.supply_date || '<span class="empty">—</span>'}</div></div>
            <div class="info-item"><div class="info-label">UOM</div><div class="info-value">${comp.uom || '<span class="empty">—</span>'}</div></div>
            <div class="info-item"><div class="info-label">Demand Date</div><div class="info-value">${comp.demand_date}</div></div>
            <div class="info-item"><div class="info-label">Creation Date</div><div class="info-value">${comp.creation_date}</div></div>
          </div>
        </div>
      </div>

      ${comp.job_po_no ? `
      <div class="detail-card animate-in delay-2">
        <div class="detail-card-header">
          <h3>📝 Purchase Order Details</h3>
          <span class="badge badge-info">PO Active</span>
        </div>
        <div class="detail-card-body">
          <div class="info-grid">
            <div class="info-item"><div class="info-label">Job / PO Number</div><div class="info-value">${comp.job_po_no}</div></div>
            <div class="info-item"><div class="info-label">PO Date</div><div class="info-value">${comp.job_po_date || '<span class="empty">—</span>'}</div></div>
            <div class="info-item"><div class="info-label">PO Quantity</div><div class="info-value">${comp.job_po_qty.toLocaleString()}</div></div>
            <div class="info-item"><div class="info-label">Vendor Name</div><div class="info-value">${comp.vendor_name || '<span class="empty">—</span>'}</div></div>
            <div class="info-item"><div class="info-label">PO Need By Date</div><div class="info-value">${comp.po_need_by_date || '<span class="empty">—</span>'}</div></div>
            <div class="info-item"><div class="info-label">Disposition ID</div><div class="info-value">${comp.disposition_id || '<span class="empty">—</span>'}</div></div>
          </div>
        </div>
      </div>
      ` : ''}

      <div class="detail-card animate-in delay-3">
        <div class="detail-card-header"><h3>🔗 Hierarchy Context</h3></div>
        <div class="detail-card-body">
          <div class="info-grid">
            <div class="info-item"><div class="info-label">MPS Transaction ID</div><div class="info-value">${parentData.mps_id}</div></div>
            <div class="info-item"><div class="info-label">Input Item Number</div><div class="info-value">${parentData.input_item}</div></div>
            <div class="info-item"><div class="info-label">Assembly Number</div><div class="info-value">${assemblyKey}</div></div>
            <div class="info-item"><div class="info-label">Component Number</div><div class="info-value">${comp.component_no}</div></div>
            <div class="info-item"><div class="info-label">Organization ID</div><div class="info-value">${comp.organization_id}</div></div>
            <div class="info-item"><div class="info-label">Compile Designator</div><div class="info-value">${comp.compile_designator}</div></div>
          </div>
        </div>
      </div>

      <div class="section-title">Related Components in Assembly ${assemblyKey}</div>
      <div class="detail-card animate-in delay-4">
        <div class="detail-card-body" style="padding: 0;">
          <table class="data-table">
            <thead>
              <tr><th>Component</th><th>Type</th><th>Demand</th><th>Supply</th><th>Allocated</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${mrpData[parentData.mps_id + ' | ' + parentData.input_item].children[assemblyKey].components.map(c => {
                const cStatus = c.required_type === 'Component Shortage' ? 'danger' : c.required_type === 'Component Stock' ? 'success' : 'info';
                const cDot = c.required_type === 'Component Shortage' ? 'red' : c.required_type === 'Component Stock' ? 'green' : 'blue';
                const isSelected = c.component_no === comp.component_no && c.disposition_id === comp.disposition_id;
                return `<tr style="${isSelected ? 'background: var(--bg-active);' : ''}">
                  <td><strong>${c.component_no}</strong></td>
                  <td><span class="status-dot ${cDot}"></span>${c.required_type}</td>
                  <td>${c.demand_qty.toLocaleString()}</td>
                  <td>${c.supply_qty.toLocaleString()}</td>
                  <td>${c.allocated_qty.toLocaleString()}</td>
                  <td><span class="badge badge-${cStatus}">${c.supply_qty >= c.demand_qty ? 'OK' : 'SHORT'}</span></td>
                </tr>`;
            }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
        }

        function exportData() {
            alert('Export functionality would download the current view as CSV/Excel.');
        }

        function refreshData() {
            const btn = document.querySelector('.btn-primary');
            btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Refreshing...';
            setTimeout(() => {
                btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Refresh';
                alert('Data refreshed successfully!');
            }, 1000);
        }

        // Initialize
        expandedNodes.add('461037261 | CSK0601C');
        renderTree();
    </script>

</body>

</html>
